name: ALSVID Platform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Prepare environment
        run: cp .env.example .env

      - name: Initialize database
        run: npm run db:push

      - name: Seed database
        run: npm run db:seed

      - name: Type check
        run: npm run lint

      - name: Production build
        run: npm run build
